<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Remote Board - Quiniela, Tómbola y 5 de Oro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,700;0,800;0,900;1,800;1,900&family=Roboto:wght@400;500;700;900&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
    
    <!-- Log errors to console safely without blocking TV screen -->
    <script>
      window.addEventListener('error', function(e) {
        console.error('TV Error:', e.message, e.filename, e.lineno);
      });
    </script>
  </head>
  <body class="bg-gray-900 text-white selection:bg-yellow-400 selection:text-black">
    <div id="root">
      <!-- Loading indicator shown before JS executes -->
      <div style="width:100vw;height:100vh;background:#050b14;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ffffff;font-family:sans-serif;">
        <div style="width:60px;height:60px;border:5px solid #eab308;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:20px;"></div>
        <h2 style="font-size:26px;font-weight:900;letter-spacing:2px;margin:0;">CARGANDO TABLERO...</h2>
        <p style="color:#94a3b8;font-size:16px;margin-top:8px;">Conectando con Remote Board</p>
        <style>@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
